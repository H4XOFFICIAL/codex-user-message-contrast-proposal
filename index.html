.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#user-message-contrast-mockups {

#user-message-contrast-mockups .comparison-key {

#user-message-contrast-mockups .day-divider {

  color: var(--muted-foreground);
}

#user-message-contrast-mockups .day-divider::before,
#user-message-contrast-mockups .day-divider::after {

@media (max-width: 520px) {

  #user-message-contrast-mockups .transcript {

  }

@media (prefers-reduced-motion: reduce) {

    transition: none;
  }

&lt;section id=&quot;user-message-contrast-mockups&quot; data-mode=&quot;soft&quot; aria-label=&quot;User message background comparison&quot;&gt;
  &lt;div class=&quot;viz-controls mockup-controls&quot; aria-label=&quot;Mockup controls&quot;&gt;
    &lt;div class=&quot;control-actions&quot;&gt;
      &lt;div class=&quot;mode-group&quot; role=&quot;group&quot; aria-label=&quot;User message treatment&quot;&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-mode-button=&quot;current&quot; aria-pressed=&quot;false&quot;&gt;Current&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-mode-button=&quot;soft&quot; aria-pressed=&quot;true&quot;&gt;Soft theme tint&lt;/button&gt;
      &lt;/div&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;play-scroll-demo&quot; type=&quot;button&quot;&gt;
        &lt;i data-lucide=&quot;play&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
        &lt;span id=&quot;scroll-button-label&quot;&gt;Play scroll demo&lt;/span&gt;
      &lt;/button&gt;
    &lt;/div&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;theme-link-badge&quot;&gt;Theme-linked&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;chat-preview&quot;&gt;
    &lt;div class=&quot;chat-header&quot;&gt;
      &lt;span&gt;Conversation&lt;/span&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;4 user prompts - long-form AI replies&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;comparison-key text-small&quot; aria-label=&quot;Surface comparison&quot;&gt;
      &lt;span class=&quot;key-item&quot;&gt;&lt;span class=&quot;key-swatch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;AI inline output&lt;/span&gt;
      &lt;span class=&quot;key-item&quot;&gt;&lt;span class=&quot;key-swatch user&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;Your message&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;transcript&quot; id=&quot;conversation-transcript&quot; role=&quot;region&quot; aria-label=&quot;Scrollable sample conversation&quot;&gt;
      &lt;div class=&quot;user-row&quot;&gt;
        &lt;article class=&quot;user-message&quot; aria-label=&quot;Your message&quot;&gt;
          &lt;p&gt;Review the release plan and explain what still needs attention before approval.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;article class=&quot;assistant-turn&quot; aria-label=&quot;Assistant response&quot;&gt;
        &lt;p&gt;I reviewed the full release plan, including the validation notes, the current interface behavior, and the boundary between preparation and publishing. The implementation is in a stable review state, but the evidence is not yet strong enough to treat the release as complete.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;Current state&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;The main workflow is coherent from start to finish. A reviewer can identify the pending change, inspect its impact, and reach the final confirmation step without losing context. The visible status is also consistent with the underlying state: preparation is complete, while publishing remains intentionally unavailable.&lt;/p&gt;
        &lt;p&gt;The remaining work is concentrated in verification rather than feature development. No new architecture is required, and there is no reason to expand the scope. The useful next step is to strengthen the evidence around keyboard behavior, contrast, and the final approval boundary.&lt;/p&gt;

        &lt;div class=&quot;ai-output&quot; aria-label=&quot;Assistant inline output&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Inline output&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;implementation=stable
keyboard_review=pending
contrast_review=pending
publishing=disabled&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;

        &lt;p&gt;&lt;strong&gt;What still needs attention&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;Confirm that every interactive control retains a visible keyboard focus state.&lt;/li&gt;
          &lt;li&gt;Verify that text and status indicators remain readable in each supported theme.&lt;/li&gt;
          &lt;li&gt;Confirm that the final publishing action cannot be triggered from a review-only state.&lt;/li&gt;
          &lt;li&gt;Capture one clean acceptance pass that records the exact state before and after confirmation.&lt;/li&gt;
        &lt;/ul&gt;

        &lt;p&gt;The important distinction is that these are release gates, not design ideas. Optional visual refinements should remain separate so they do not blur the decision about whether the current change is ready.&lt;/p&gt;
        &lt;p&gt;My recommendation is to keep the release paused, complete those four checks in order, and then present only the resulting evidence for approval. That gives the reviewer a short decision surface without hiding the detailed work that supports it.&lt;/p&gt;
      &lt;/article&gt;

      &lt;div class=&quot;user-row&quot;&gt;
        &lt;article class=&quot;user-message&quot; aria-label=&quot;Your message&quot;&gt;
          &lt;p&gt;Show me the exact verification sequence and explain why each step matters.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;article class=&quot;assistant-turn&quot; aria-label=&quot;Assistant response&quot;&gt;
        &lt;p&gt;The verification should run as a single controlled sequence because each step establishes the conditions for the next one. Splitting the checks across unrelated sessions would make it harder to know whether the tested state is the same state that is eventually approved.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;1. Establish the starting state&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Begin with the application in review mode, with publishing disabled and no modal or transient notification open. Record the current version and the visible status. This creates a baseline and prevents a later result from being attributed to an unknown state.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;2. Verify keyboard navigation&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Move through the complete interaction using only the keyboard. Focus should follow the visual order, remain visible against every surface, and never become trapped inside a dialog or scroll region. This matters because a workflow that only works with a pointer is incomplete even when its visual layout appears correct.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;3. Verify theme contrast&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Repeat the critical states in the default theme and one customized theme. The review is not limited to a single screenshot: the selected state, disabled state, inline output, and confirmation text all need to remain distinguishable when the theme tokens change.&lt;/p&gt;

        &lt;div class=&quot;ai-output&quot; aria-label=&quot;Assistant inline output&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Verification order&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;01 capture_start_state
02 verify_keyboard_path
03 verify_theme_contrast
04 verify_publish_lock
05 record_acceptance_result&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;

        &lt;p&gt;&lt;strong&gt;4. Verify the publishing boundary&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;Attempt to reach the final action from every review-only entry point. The interface may explain that publishing is unavailable, but it must never expose a path that performs the external action. This check protects the authority boundary rather than merely testing a button label.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;5. Record the acceptance result&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;After the checks pass, capture the exact version, the completed results, and the still-disabled publishing state. The record should be concise enough to review quickly while remaining specific enough to reproduce. A screenshot alone is useful visual evidence, but it should be paired with the state values that explain what the screenshot represents.&lt;/p&gt;

        &lt;p&gt;This sequence matters because it turns a subjective “looks ready” judgment into a bounded acceptance decision. If any step fails, the process stops at that step and the failed state remains visible for correction.&lt;/p&gt;
      &lt;/article&gt;

      &lt;div class=&quot;day-divider text-small&quot; aria-label=&quot;Later&quot;&gt;Later&lt;/div&gt;

      &lt;div class=&quot;user-row&quot;&gt;
        &lt;article class=&quot;user-message&quot; aria-label=&quot;Your message&quot;&gt;
          &lt;p&gt;The checks passed. Summarize the remaining decision without repeating the whole review.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;article class=&quot;assistant-turn&quot; aria-label=&quot;Assistant response&quot;&gt;
        &lt;p&gt;The verification evidence now supports a narrow approval decision. Keyboard navigation completed without a focus trap, the critical surfaces remained distinguishable in both tested themes, and the publishing action stayed unavailable throughout the review.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;What the evidence establishes&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;The interface change behaves consistently in the tested states. User-facing status remains truthful, the selected and disabled controls are visually distinct, and the review flow does not accidentally promote preparation into publication. The captured result also corresponds to the same version that was inspected at the start of the sequence.&lt;/p&gt;

        &lt;div class=&quot;ai-output&quot; aria-label=&quot;Assistant inline output&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Acceptance evidence&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;keyboard_path=passed
theme_contrast=passed
publish_lock=passed
version_match=passed
external_action=not_performed&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;

        &lt;p&gt;&lt;strong&gt;What the evidence does not establish&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;It does not authorize publication.&lt;/li&gt;
          &lt;li&gt;It does not approve unrelated visual refinements.&lt;/li&gt;
          &lt;li&gt;It does not replace future testing if the implementation changes.&lt;/li&gt;
          &lt;li&gt;It does not claim coverage for platforms that were not part of this review.&lt;/li&gt;
        &lt;/ul&gt;

        &lt;p&gt;The remaining decision is therefore simple: approve the verified interface change for inclusion in the next release, or return it for a specific correction. Publication is still a separate action and remains disabled until it is explicitly authorized.&lt;/p&gt;
        &lt;p&gt;If approved, the durable record should contain the version identifier, the five verification results, and the statement that no external action occurred during review. That is enough evidence to move forward without repeating the full analysis.&lt;/p&gt;
      &lt;/article&gt;

      &lt;div class=&quot;user-row&quot;&gt;
        &lt;article class=&quot;user-message&quot; aria-label=&quot;Your message&quot;&gt;
          &lt;p&gt;Approved for the next release. Keep publication disabled and give me the final handoff summary.&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;article class=&quot;assistant-turn&quot; aria-label=&quot;Assistant response&quot;&gt;
        &lt;p&gt;The verified interface change is approved for the next release, and the handoff remains bounded to that change. Publishing is still disabled, no external communication has been sent, and the optional visual ideas remain outside the approved scope.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;Approved outcome&lt;/strong&gt;&lt;/p&gt;
        &lt;p&gt;The release candidate may include the reviewed accessibility and state-clarity improvements. The acceptance record is tied to the tested version, and the verification results are preserved as the supporting evidence.&lt;/p&gt;

        &lt;p&gt;&lt;strong&gt;Preserved boundaries&lt;/strong&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;Publishing requires a separate explicit authorization.&lt;/li&gt;
          &lt;li&gt;Any implementation change invalidates the current acceptance record until the affected checks are rerun.&lt;/li&gt;
          &lt;li&gt;Optional visual refinements remain proposals rather than approved release work.&lt;/li&gt;
          &lt;li&gt;The handoff does not claim testing beyond the platforms and themes already recorded.&lt;/li&gt;
        &lt;/ul&gt;

        &lt;div class=&quot;ai-output&quot; aria-label=&quot;Assistant inline output&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Final handoff&lt;/span&gt;
          &lt;pre&gt;&lt;code&gt;release_change=approved
publishing=disabled
evidence=recorded
scope=unchanged
next_action=await_explicit_publish_authorization&lt;/code&gt;&lt;/pre&gt;
        &lt;/div&gt;

        &lt;p&gt;The next person opening this review should be able to understand the result without reconstructing the entire conversation: the change passed its defined checks, it is approved for inclusion, and every external action remains blocked until separately authorized.&lt;/p&gt;
        &lt;p&gt;No further work is required for this review state. The correct next move is to preserve the evidence, keep the candidate unchanged, and wait for the explicit publication decision.&lt;/p&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;state-detail text-small text-muted&quot; id=&quot;surface-note&quot; aria-live=&quot;polite&quot;&gt;
    Sparse theme-tinted user prompts remain visible anchors inside long AI responses.
  &lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;user-message-contrast-mockups&quot;);
  const buttons = Array.from(root.querySelectorAll(&quot;[data-mode-button]&quot;));
  const note = root.querySelector(&quot;#surface-note&quot;);
  const badge = root.querySelector(&quot;#theme-link-badge&quot;);
  const transcript = root.querySelector(&quot;#conversation-transcript&quot;);
  const scrollButton = root.querySelector(&quot;#play-scroll-demo&quot;);
  const scrollButtonLabel = root.querySelector(&quot;#scroll-button-label&quot;);
  const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  let animationFrame = null;
  let animationStart = null;
  let autoplayTimer = null;
  const copy = {
    current: &quot;Inside long AI responses, user prompts blend into the same neutral surfaces as inline output.&quot;,
    soft: &quot;Sparse theme-tinted user prompts remain visible anchors inside long AI responses.&quot;
  };

  function setMode(mode) {
    root.dataset.mode = mode;
    buttons.forEach((button) =&gt; {
      button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.modeButton === mode));
    });
    note.textContent = copy[mode];
    badge.textContent = mode === &quot;current&quot; ? &quot;Current behavior&quot; : &quot;Theme-linked&quot;;
  }

  function finishScroll() {
    if (animationFrame !== null) {
      window.cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
    animationStart = null;
    scrollButton.disabled = false;
    scrollButtonLabel.textContent = &quot;Replay scroll demo&quot;;
  }

  function playScrollDemo(forceMotion = false) {
    if (autoplayTimer !== null) {
      window.clearTimeout(autoplayTimer);
      autoplayTimer = null;
    }
    if (animationFrame !== null) {
      finishScroll();
    }

    transcript.scrollTop = 0;
    const maximum = transcript.scrollHeight - transcript.clientHeight;
    if (maximum &lt;= 0) {
      finishScroll();
      return;
    }

    if (reduceMotion &amp;&amp; !forceMotion) {
      finishScroll();
      return;
    }

    scrollButton.disabled = true;
    scrollButtonLabel.textContent = &quot;Scrolling...&quot;;
    const duration = Math.min(26000, Math.max(18000, maximum * 5));

    function step(timestamp) {
      if (animationStart === null) {
        animationStart = timestamp;
      }
      const progress = Math.min((timestamp - animationStart) / duration, 1);
      const eased = progress * progress * (3 - 2 * progress);
      transcript.scrollTop = maximum * eased;

      if (progress &lt; 1) {
        animationFrame = window.requestAnimationFrame(step);
      } else {
        finishScroll();
      }
    }

    animationFrame = window.requestAnimationFrame(step);

  buttons.forEach((button) =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
